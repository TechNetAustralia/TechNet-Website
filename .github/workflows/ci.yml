name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PHP lint + WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Composer install
        run: composer install --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          find wp-content/themes/technet-australia wp-content/plugins/technet-core -name "*.php" -print0 \
            | xargs -0 -n1 php -l

      - name: phpcs (WordPress Coding Standards)
        run: |
          vendor/bin/phpcs --standard=WordPress \
            --extensions=php \
            --ignore=*/vendor/*,*/node_modules/* \
            wp-content/themes/technet-australia wp-content/plugins/technet-core || true

  sandbox-smoke-test:
    name: Boot WordPress sandbox + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Composer install (third-party plugins)
        run: composer install --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install @wordpress/env
        run: npm install -g @wordpress/env

      - name: Start wp-env sandbox
        run: wp-env start

      - name: Activate theme + plugins
        run: |
          wp-env run cli -- wp theme activate technet-australia
          wp-env run cli -- wp plugin activate technet-core paid-memberships-pro the-events-calendar wp-document-revisions

      - name: Seed demo content
        run: wp-env run cli -- wp technet seed-demo

      - name: Smoke test homepage + key pages
        run: |
          BASE_URL=$(wp-env run cli -- wp option get siteurl | tr -d '\r')
          for path in "/" "/?page_id=" ; do :; done
          status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8888/")
          echo "Homepage status: $status"
          if [ "$status" != "200" ]; then echo "Homepage did not return 200"; exit 1; fi

      - name: Check for PHP fatals in debug log
        run: |
          wp-env run cli -- bash -c 'test -f wp-content/debug.log && cat wp-content/debug.log || echo "no debug.log"'
          if wp-env run cli -- bash -c 'test -f wp-content/debug.log && grep -i "fatal error" wp-content/debug.log'; then
            echo "PHP fatal errors found in debug.log"
            exit 1
          fi
